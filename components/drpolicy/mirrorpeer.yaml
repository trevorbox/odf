apiVersion: multicluster.odf.openshift.io/v1alpha1
kind: MirrorPeer
metadata:
  name: mirrorpeer
spec:
  type: async
  manageS3: true
  schedulingIntervals:
    - 5m
  items:
    - clusterName: primary-cluster
      storageClusterRef:
        name: ocs-storagecluster
        namespace: openshift-storage
    - clusterName: secondary-cluster
      storageClusterRef:
        name: ocs-storagecluster
        namespace: openshift-storage
