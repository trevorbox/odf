apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateless-sample
  labels:
    app: stateless-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stateless-sample
  template:
    metadata:
      labels:
        app: stateless-sample
    spec:
      containers:
        - name: pause
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
